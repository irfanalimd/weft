[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
weft-core = { path = "crates/weft-core" }
weft-sync = { path = "crates/weft-sync" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde_json = "1"
crc32fast = "1"
tokio-tungstenite = "0.28"
wasm-bindgen = "0.2"
js-sys = "0.3"
base64 = "0.22"
rand = "0.9"
proptest = "1"
criterion = "0.7"

[profile.release]
lto = true
codegen-units = 1

[profile.release.package.weft-wasm]
opt-level = "s"
